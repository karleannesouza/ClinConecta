<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="confirmacao-agendamento.css">

  <title>Confirmação do agendamento | ClicConecta</title>
</head>

<body>

  <header class="header">

    <a class="brand" href="index.html" aria-label="ClicConecta, página inicial">

      <img src="../../../public/images/logoprincipal.png" alt="ClinConecta">

    </a>

    <div class="clinic">

      <img class="clinic-icon" src="../../../public/images/coracaovazado.png" alt="">

      <div>
        <strong>Clínica Popular</strong>
        <small>Atendimento acessível de qualidade</small>
      </div>

    </div>

  </header>


  <main>

    <section class="card" aria-labelledby="titulo">

      <div class="success">

        <div class="check" aria-hidden="true">
          ✓
        </div>

        <h1 id="titulo">
          Agendamento confirmado!
        </h1>

        <p class="subtitle">
          Seu agendamento foi realizado com sucesso.
        </p>

      </div>


      <div class="details">

        <div class="row">

          <span class="icon" aria-hidden="true">♧</span>

          <div>
            <span class="label">Tipo</span>
            <span class="value" id="tipo"></span>
          </div>

        </div>


        <div class="row">

          <span class="icon" aria-hidden="true">♧</span>

          <div>
            <span class="label">Especialidade</span>
            <span class="value" id="especialidade"></span>
          </div>

        </div>


        <div class="row">

          <span class="icon" aria-hidden="true">♙</span>

          <div>
            <span class="label">Profissional</span>
            <span class="value" id="profissional"></span>
          </div>

        </div>


        <div class="row">

          <span class="icon" aria-hidden="true">▣</span>

          <div>
            <span class="label">Data</span>
            <span class="value" id="data"></span>
          </div>

        </div>


        <div class="row">

          <span class="icon" aria-hidden="true">◷</span>

          <div>
            <span class="label">Horário</span>
            <span class="value" id="horario"></span>
          </div>

        </div>

      </div>


      <a class="button" href="meus-agendamentos.html">
        <span>▣</span>
        Meus agendamentos
      </a>

    </section>


    <p id="demo" class="demo" hidden>
      Prévia com dados de exemplo.
    </p>

  </main>


  <script src="confirmacao-agendamento.js"></script>

</body>
</html>
