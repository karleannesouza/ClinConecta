<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar exame | ClinConecta</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../Agendamento-consulta/agendamento.css">
    <link rel="stylesheet" href="./agendamento-exame.css">
    <script src="./agendamento-exame.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <a href="../../index.html">
            <img class="logo" src="../../../public/images/logoprincipal.png" alt="ClinConecta - página inicial">
        </a>
        <div class="identificacao-clinica">
            <img class="icone-clinica" src="../../../public/images/coracaovazado.png" alt="">
            <div class="textos-clinica">
                <p class="nome-clinica">Clínica Conecta</p>
                <p class="descricao-clinica">Atendimento acessível e de qualidade.</p>
            </div>
        </div>
    </header>

    <main class="pagina-agendamento">
        <section class="painel-agendamento" aria-labelledby="titulo-pagina">
            <p class="rotulo-etapa">Agendar exame</p>
            <h1 id="titulo-pagina">Qual exame você precisa?</h1>
            <p class="descricao-pagina">Selecione o exame, a data e um horário disponível.</p>

            <form id="form-exame" novalidate>
                <label class="campo-formulario" for="exame-busca">
                    <span class="rotulo-campo">Exame <span class="obrigatorio">*</span></span>
                    <span class="combobox" data-combobox-exame>
                        <input id="exame-busca" class="combobox-input" type="text" placeholder="Selecione um exame" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="lista-exames" readonly>
                        <input id="exame" name="exame" type="hidden">
                        <button class="combobox-limpar" type="button" aria-label="Limpar exame" hidden>×</button>
                        <button class="combobox-seta" type="button" aria-label="Abrir exames" aria-controls="lista-exames" aria-expanded="false">⌄</button>
                        <span class="combobox-lista" id="lista-exames" role="listbox" hidden></span>
                    </span>
                </label>

                <!-- aria-live anuncia a descrição sempre que o exame muda. -->
                <div class="descricao-exame" id="descricao-exame" aria-live="polite" hidden>
                    <strong data-descricao-nome></strong>
                    <p data-descricao-texto></p>
                    <p class="preparo-exame"><span>Preparo:</span> <span data-descricao-preparo></span></p>
                </div>

                <label class="campo-formulario" for="data-exame-busca">
                    <span class="rotulo-campo">Data <span class="obrigatorio">*</span></span>
                    <span class="combobox combobox-desabilitado" data-combobox-data>
                        <input id="data-exame-busca" class="combobox-input" type="text" placeholder="Selecione um exame primeiro" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="calendario-exame" readonly disabled>
                        <input id="data-exame" name="data" type="hidden">
                        <button class="combobox-seta" type="button" aria-label="Abrir calendário" aria-controls="calendario-exame" aria-expanded="false" disabled>⌄</button>
                        <div class="calendario" id="calendario-exame" role="dialog" aria-label="Selecione uma data" hidden>
                            <div class="calendario-cabecalho">
                                <button class="calendario-fechar" type="button" data-calendario-fechar aria-label="Fechar calendário">×</button>
                                <button class="calendario-navegacao" type="button" data-mes-anterior aria-label="Mês anterior">‹</button>
                                <strong class="calendario-mes" data-calendario-mes></strong>
                                <button class="calendario-navegacao" type="button" data-mes-proximo aria-label="Próximo mês">›</button>
                            </div>
                            <div class="calendario-semana" aria-hidden="true">
                                <span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span>
                            </div>
                            <div class="calendario-dias" data-calendario-dias></div>
                            <div class="calendario-acoes">
                                <button class="calendario-botao" type="button" data-calendario-confirmar disabled>Confirmar</button>
                            </div>
                        </div>
                    </span>
                </label>

                <label class="campo-formulario" for="horario-busca">
                    <span class="rotulo-campo">Horário disponível <span class="obrigatorio">*</span></span>
                    <span class="combobox combobox-desabilitado" data-combobox-horario>
                        <input id="horario-busca" class="combobox-input" type="text" placeholder="Selecione uma data primeiro" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="lista-horarios" readonly disabled>
                        <input id="horario" name="horario" type="hidden">
                        <button class="combobox-limpar" type="button" aria-label="Limpar horário" hidden>×</button>
                        <button class="combobox-seta" type="button" aria-label="Abrir horários" aria-controls="lista-horarios" aria-expanded="false" disabled>⌄</button>
                        <span class="combobox-lista" id="lista-horarios" role="listbox" hidden></span>
                    </span>
                </label>

                <p class="mensagem-formulario" id="mensagem-formulario" role="alert" hidden></p>

                <div class="acoes-formulario">
                    <a class="botao botao-secundario" href="../../index.html">Voltar</a>
                    <button class="button-cadastrar" type="submit">Concluir agendamento</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
