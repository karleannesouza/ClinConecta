<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Permite exibir acentos corretamente -->
    <meta charset="UTF-8">

    <!-- Adapta a página à largura do dispositivo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cancelar agendamento - ClinConecta</title>

    <!-- Aparência compartilhada pelo projeto -->
    <link rel="stylesheet" href="../../styles/global.css">

    <!-- Aparência específica do cancelamento -->
    <link rel="stylesheet" href="./cancelamento-agendamento.css">

    <!-- Executa o JavaScript depois da leitura do HTML -->
    <script src="./cancelamento-agendamento.js" defer></script>
</head>
<body>
    <!-- Área temporária: será substituída pela integração com a listagem -->
    <main class="pagina-teste-cancelamento">
        <h1>Teste de cancelamento</h1>

        <button type="button" id="abrir-cancelamento">
            Cancelar agendamento
        </button>

        <!-- Mostra mensagens de erro ou confirmação -->
        <p id="mensagem-cancelamento" role="status"></p>
    </main>

    <!-- Janela de confirmação, inicialmente fechada -->
    <dialog
        id="modal-cancelamento"
        class="modal-cancelamento"
        aria-labelledby="titulo-cancelamento"
        aria-describedby="descricao-cancelamento"
    >
        <!-- Fecha sem alterar o agendamento -->
        <button
            type="button"
            id="fechar-cancelamento"
            class="fechar-modal"
            aria-label="Fechar confirmação de cancelamento"
        >
            <span aria-hidden="true">×</span>
        </button>

        <h2 id="titulo-cancelamento">Cancelar agendamento</h2>

        <p id="descricao-cancelamento">
            Tem certeza de que deseja cancelar este agendamento?
        </p>

        <!-- O JavaScript preenche estes parágrafos -->
        <div id="resumo-agendamento" class="resumo-agendamento">
            <p id="resumo-servico"></p>
            <p id="resumo-profissional"></p>
            <p id="resumo-data-horario"></p>
        </div>

        <!-- Ações disponíveis na confirmação -->
        <div class="acoes-cancelamento">
            <button
                type="button"
                id="desistir-cancelamento"
                autofocus
            >
                Voltar
            </button>

            <button type="button" id="confirmar-cancelamento">
                Cancelar agendamento
            </button>
        </div>
    </dialog>
</body>
</html>
