<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar consulta | ClinConecta</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="./agendamento.css">
    <script src="./agendamento-consulta.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <a href="../../index.html">
            <img class="logo" src="../../../public/images/logoprincipal.png" alt="ClinConecta - página inicial">
        </a>
        <div class="identificacao-clinica">
            <img class="icone-clinica" src="../../../public/images/coracaovazado.png" alt="">
            <div class="textos-clinica">
                <p class="nome-clinica">Clínica Conecta</p>
                <p class="descricao-clinica">Atendimento acessível e de qualidade.</p>
            </div>
        </div>
    </header>

    <main class="pagina-agendamento">
        <section class="painel-agendamento" aria-labelledby="titulo-pagina">
            <p class="rotulo-etapa">Agendar consulta</p>
            <h1 id="titulo-pagina">Qual especialidade você precisa?</h1>
            <p class="descricao-pagina">Selecione uma especialidade para ver os profissionais disponíveis.</p>

            <form id="form-especialidade">
                <label class="campo-formulario" for="especialidade">
                    <span class="rotulo-campo">Especialidade <span class="obrigatorio">*</span></span>
                    <span class="combobox" data-combobox>
                        <input id="especialidade-busca" class="combobox-input" type="text" placeholder="Selecione uma especialidade" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="lista-especialidades" readonly>
                        <input id="especialidade" name="especialidade" type="hidden">
                        <button class="combobox-limpar" type="button" aria-label="Limpar especialidade" hidden>×</button>
                        <button class="combobox-seta" type="button" aria-label="Abrir especialidades" aria-controls="lista-especialidades" aria-expanded="false">⌄</button>
                        <span class="combobox-lista" id="lista-especialidades" role="listbox" hidden></span>
                    </span>
                </label>

                <label class="campo-formulario" for="profissional">
                    <span class="rotulo-campo">Profissional <span class="obrigatorio">*</span></span>
                    <span class="combobox combobox-desabilitado" data-combobox-profissional>
                        <input id="profissional-busca" class="combobox-input" type="text" placeholder="Selecione uma especialidade primeiro" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="lista-profissionais" readonly disabled>
                        <input id="profissional" name="profissional" type="hidden">
                        <button class="combobox-limpar" type="button" aria-label="Limpar profissional" hidden>×</button>
                        <button class="combobox-seta" type="button" aria-label="Abrir profissionais" aria-controls="lista-profissionais" aria-expanded="false" disabled>⌄</button>
                        <span class="combobox-lista" id="lista-profissionais" role="listbox" hidden></span>
                    </span>
                </label>

                <label class="campo-formulario campo-data" for="data-consulta">
                    <span class="rotulo-campo">Data <span class="obrigatorio">*</span></span>
                    <span class="combobox combobox-desabilitado" data-combobox-data>
                        <input id="data-consulta-busca" class="combobox-input" type="text" placeholder="Selecione um profissional primeiro" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="calendario-consulta" readonly disabled>
                        <input id="data-consulta" name="data" type="hidden" required>
                        <button class="combobox-seta" type="button" aria-label="Abrir calendário" aria-controls="calendario-consulta" aria-expanded="false" disabled>⌄</button>
                        <div class="calendario" id="calendario-consulta" role="dialog" aria-label="Selecione uma data" hidden>
                            <div class="calendario-cabecalho">
                                <button class="calendario-fechar" type="button" data-calendario-fechar aria-label="Fechar calendário">×</button>
                                <button class="calendario-navegacao" type="button" data-mes-anterior aria-label="Mês anterior">‹</button>
                                <strong class="calendario-mes" data-calendario-mes></strong>
                                <button class="calendario-navegacao" type="button" data-mes-proximo aria-label="Próximo mês">›</button>
                            </div>
                            <div class="calendario-semana" aria-hidden="true">
                                <span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span>
                            </div>
                            <div class="calendario-dias" data-calendario-dias></div>
                            <div class="calendario-acoes">
                                <button class="calendario-botao" type="button" data-calendario-confirmar disabled>Confirmar</button>
                            </div>
                        </div>
                    </span>
                </label>

                <label class="campo-formulario" for="horario-busca">
                    <span class="rotulo-campo">Horário disponível <span class="obrigatorio">*</span></span>
                    <span class="combobox combobox-desabilitado" data-combobox-horario>
                        <input id="horario-busca" class="combobox-input" type="text" placeholder="Selecione uma data primeiro" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="lista-horarios" readonly disabled>
                        <input id="horario" name="horario" type="hidden">
                        <button class="combobox-limpar" type="button" aria-label="Limpar horário" hidden>×</button>
                        <button class="combobox-seta" type="button" aria-label="Abrir horários" aria-controls="lista-horarios" aria-expanded="false" disabled>⌄</button>
                        <span class="combobox-lista" id="lista-horarios" role="listbox" hidden></span>
                    </span>
                </label>

                <p class="mensagem-formulario" id="mensagem-formulario" role="alert" hidden>
                    Selecione uma especialidade para continuar.
                </p>

                <div class="acoes-formulario">
                    <a class="botao botao-secundario" href="../../src/index.html">Voltar</a>
                    <button class="button-cadastrar" type="submit" disabled>Continuar</button>
                </div>

            </form>
        </section>
    </main>
</body>
</html>
