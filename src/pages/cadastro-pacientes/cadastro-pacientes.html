<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ClinConecta</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="./cadastro.css">
    <script src="./cadastro.js" defer></script>
</head>
<body>
    <header class="cabecalho">
    <a href="../../../index.html">
    <img class="logo" src="../../../public/images/logoprincipal.png" alt="ClinConecta - página inicial">
    </a>
    <div class="identificacao-clinica">
    <img class="icone-clinica" src="../../../public/images/coracaovazado.png" alt="">
        <div class="textos-clinica">
            <p class="nome-clinica">Clínica Conecta</p>
            <p class="descricao-clinica">Atendimento acessível e de qualidade.</p>
        </div>
    </div>
    </header>
    <main>
        <h1>Crie sua conta</h1>
        <p class="instrucao">Preencha os dados abaixo para se cadastrar.</p>
        
        <form id="form-cadastro">

            <label for="nome">Nome Completo:<span class= "obrigatorio">*</span></label>
            <div class="campo-com-icone">
                <svg class="icone-campo" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21v-2a8 8 0 0 1 16 0v2"></path>
                </svg>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>            
            </div>

            <label for="cpf">CPF:<span class="obrigatorio">*</span></label> 
            <div class="campo-com-icone">
                <svg class="icone-campo" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3 L20 6 V11 C20 16 17 20 12 22 C7 20 4 16 4 11 V6 Z"></path>
                    <rect x="9" y="9" width="6" height="7" rx="1"></rect>
                </svg>
                <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" inputmode="numeric" maxlength="11" required>
            </div>

            <label for="nascimento">Data de nascimento:<span class="obrigatorio">*</span></label>
            <div class="campo-com-icone">
                <svg class="icone-campo" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                    <path d="M16 3v4 M8 3v4 M3 11h18"></path>
                </svg>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>

            <label for="telefone">Telefone:<span class="obrigatorio">*</span></label>           
            <div class="campo-com-icone">
                <svg class="icone-campo" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.79a2 2 0 0 1-.45 2.11L8.09 9.89a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.89.34 1.83.58 2.79.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" inputmode="numeric" autocomplete="tel" required>
            </div>

            <label for="email">E-mail:<span class="obrigatorio">*</span></label>
            <div class="campo-com-icone">
                <svg class="icone-campo" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="M3 6l9 7 9-7"></path>
                </svg>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <label for="senha">Senha:<span class="obrigatorio">*</span></label>
            <div class="campo-com-icone">
                <svg class="icone-campo" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                    <path d="M8 10V6a4 4 0 0 1 8 0v4"></path>
                    <circle cx="12" cy="15" r="1"></circle>
                </svg>
                <input type="password" id="senha" name="senha" minlength="8" aria-describedby="ajuda-senha" placeholder="Crie sua senha" required>
                <button
                    type="button"
                    class="alternar-senha"
                    aria-controls="senha"
                    aria-label="Mostrar senha"
                    aria-pressed="false"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <ul id="ajuda-senha" class="requisitos-senha">
                <li id="requisito-tamanho">Pelo menos 8 caracteres</li>
                <li id="requisito-maiuscula">Uma letra maiúscula</li>
                <li id="requisito-especial">Um caractere especial</li>
            </ul>
            
            <label for="confirmar-senha">Confirme sua senha:<span class="obrigatorio">*</span></label>          
            <div class="campo-com-icone">
                <svg class="icone-campo" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                    <path d="M8 10V6a4 4 0 0 1 8 0v4"></path>
                    <circle cx="12" cy="15" r="1"></circle>
                </svg>
            <input type="password" id="confirmar-senha" name="confirmarSenha" placeholder="Confirme sua senha" required>
            <button
                type="button"
                class="alternar-senha"
                aria-controls="confirmar-senha"
                aria-label="Mostrar confirmação de senha"
                aria-pressed="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
            </div>

            <button type="submit" class="button-cadastrar">Cadastrar</button>

            <p id="mensagem-cadastro" role="status"></p>
        </form>
    </main>
    
</body>
</html>
