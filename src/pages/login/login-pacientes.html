<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesse sua conta - ClinConecta</title>
  <link rel="stylesheet" href="login-pacientes.css" />
</head>

<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">

    <!-- Logo principal -->
    <a href="../../index.html">
      <img
        class="logo"
        src="../../../public/images/logoprincipal.png"
        alt="ClinConecta - página inicial"
      />
    </a>

    <!-- Identificação da clínica -->
    <div class="identificacao-clinica">

      <!-- Coração vazado -->
      <img
        class="icone-clinica"
        src="../../../public/images/coracaovazado.png"
        alt=""
      />

      <div class="textos-clinica">
        <p class="nome-clinica">Clínica Conecta</p>
        <p class="descricao-clinica">
          Atendimento acessível e de qualidade.
        </p>
      </div>

    </div>

  </header>

  <!-- Área principal de login -->
  <main class="login-container">

    <div class="login-card">

      <!-- Título e descrição -->
      <div class="card-header">

        <h1 class="card-title">
          Acesse sua conta
        </h1>

        <p class="card-subtitle">
          Informe seu e-mail ou CPF e senha para continuar.
        </p>

      </div>

      <!-- Formulário de login -->
      <form
        class="login-form"
        id="loginForm"
        novalidate
      >

        <!-- Campo de e-mail ou CPF -->
        <div class="form-group">

          <label
            for="identifier"
            class="form-label"
          >
            E-mail ou CPF
          </label>

          <div class="input-wrapper">

            <!-- Ícone de envelope -->
            <span
              class="input-icon-left"
              aria-hidden="true"
            >

              <svg
                class="icon icon-envelope"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect
                  width="20"
                  height="16"
                  x="2"
                  y="4"
                  rx="2"
                />

                <path
                  d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"
                />
              </svg>

            </span>

            <input
              type="text"
              id="identifier"
              name="identifier"
              class="form-input"
              placeholder="Digite seu e-mail ou CPF"
              required
              autocomplete="username"
            />

          </div>

        </div>

        <!-- Campo de senha -->
        <div class="form-group">

          <label
            for="password"
            class="form-label"
          >
            Senha
          </label>

          <div class="input-wrapper">

            <!-- Ícone de cadeado -->
            <span
              class="input-icon-left"
              aria-hidden="true"
            >

              <svg
                class="icon icon-lock"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >

                <rect
                  width="18"
                  height="11"
                  x="3"
                  y="11"
                  rx="2"
                  ry="2"
                />

                <path
                  d="M7 11V7a5 5 0 0 1 10 0v4"
                />

              </svg>

            </span>

            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Digite sua senha"
              required
              autocomplete="current-password"
            />

            <!-- Botão para mostrar ou ocultar senha -->
            <button
              type="button"
              class="password-toggle-btn"
              id="togglePasswordBtn"
              aria-label="Mostrar ou ocultar senha"
            >

              <svg
                class="icon icon-eye"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >

                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                />

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                />

              </svg>

            </button>

          </div>

        </div>

        <!-- Botão de login -->
        <button
          type="submit"
          class="btn btn-primary"
          id="submitBtn"
        >

          <span>Entrar</span>

          <!-- Ícone de seta -->
          <svg
            class="icon icon-arrow-right"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >

            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />

          </svg>

        </button>

      </form>

      <!-- Link para cadastro -->
      <div class="signup-prompt">

        <span>
          Não tem uma conta?
        </span>

        <a
          href="../cadastro-pacientes/cadastro-pacientes.html"
          class="signup-link"
        >
          Cadastre-se
        </a>

      </div>

      <!-- Mensagem de erro -->
      <div
        class="alert alert-error"
        role="alert"
        id="errorMessage"
      >

        <svg
          class="icon icon-error"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >

          <circle
            cx="12"
            cy="12"
            r="10"
            fill="currentColor"
          />

          <line
            x1="12"
            y1="8"
            x2="12"
            y2="12"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="round"
          />

          <circle
            cx="12"
            cy="16"
            r="1"
            fill="#ffffff"
          />

        </svg>

        <span class="alert-text">
          E-mail ou senha inválidos.
        </span>

      </div>

    </div>

  </main>

  <!-- JavaScript da página -->
  <script src="login-pacientes.js"></script>

</body>
</html>
